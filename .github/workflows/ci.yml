name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run docs:tools:check
      - run: npm run coverage
      # The e2e smoke (`npm run e2e`) needs a bridge-patched engine, so it runs locally, not here.
